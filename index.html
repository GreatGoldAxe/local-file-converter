<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地文件格式转换器 · Local File Converter</title>
<meta name="description" content="纯浏览器本地文件格式转换：PDF、Word、Excel、图片、OCR、数据、电子书、音视频、PPT。文件不上传服务器。">
<style>
/* ========== 颜色与基础变量 ========== */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f9fafb; --text:#1f2328; --muted:#646b75; --line:#e3e6ea;
  --accent:#2563eb; --accent-weak:#e8efff; --ok:#16a34a; --ok-weak:#e7f6ec; --warn:#b45309; --warn-weak:#fff4e0;
  --err:#dc2626; --err-weak:#fdecec; --info:#0369a1; --info-weak:#e6f3fb; --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  --radius:10px; --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --panel:#1b1e23; --panel2:#20242a; --text:#e6e8eb; --muted:#9aa3ad; --line:#2d323a;
    --accent:#5b8cff; --accent-weak:#1e2a46; --ok:#3fbf6f; --ok-weak:#16301f; --warn:#e3a14a; --warn-weak:#33270f;
    --err:#f26b6b; --err-weak:#3a1a1a; --info:#55b2e6; --info-weak:#13293a; --shadow:0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --panel:#1b1e23; --panel2:#20242a; --text:#e6e8eb; --muted:#9aa3ad; --line:#2d323a;
  --accent:#5b8cff; --accent-weak:#1e2a46; --ok:#3fbf6f; --ok-weak:#16301f; --warn:#e3a14a; --warn-weak:#33270f;
  --err:#f26b6b; --err-weak:#3a1a1a; --info:#55b2e6; --info-weak:#13293a; --shadow:0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
code,kbd{font-family:var(--mono);font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.hidden{display:none !important}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* ========== 顶部栏 ========== */
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.brand h1{font-size:16px;margin:0;white-space:nowrap}
.privacy{display:flex;align-items:center;gap:6px;background:var(--ok-weak);color:var(--ok);border-radius:999px;padding:3px 10px;font-size:12.5px}
.top .spacer{flex:1}
.top .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--err)}
.btn.sm{padding:3px 8px;font-size:12.5px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel2)}
.envbar{font-size:12px;color:var(--muted)}

/* ========== 主布局 ========== */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr) 380px;gap:14px;padding:14px;max-width:1680px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
nav.side{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 84px);overflow:auto;padding:10px}
nav.side .search{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:8px}
.navgroup{margin-bottom:4px}
.navgroup > .gtitle{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;padding:7px 8px;border-radius:7px;cursor:pointer;font-weight:600;text-align:left}
.navgroup > .gtitle:hover{background:var(--panel2)}
.navgroup > .gtitle .cnt{font-weight:400;color:var(--muted);font-size:12px}
.navitems{padding-left:6px}
.navitem{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;padding:5px 8px;border-radius:6px;cursor:pointer;text-align:left;font-size:13px;color:var(--text)}
.navitem:hover{background:var(--panel2)}
.navitem.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.navitem.dragover{outline:2px dashed var(--accent)}
.navitem .dot{width:7px;height:7px;border-radius:50%;flex:none}
.navitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navtoggle{display:none}

main.center{min-width:0;display:flex;flex-direction:column;gap:14px}
aside.right{min-width:0;display:flex;flex-direction:column;gap:14px;position:sticky;top:70px;align-self:start;max-height:calc(100vh - 84px)}
.section{padding:16px}
.section h2{font-size:17px;margin:0 0 6px}
.section h3{font-size:14px;margin:14px 0 6px}

/* ========== 支持程度标签 ========== */
.lv{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.lv-full{background:var(--ok-weak);color:var(--ok)}
.lv-partial{background:var(--warn-weak);color:var(--warn)}
.lv-text{background:var(--info-weak);color:var(--info)}
.lv-backend{background:var(--err-weak);color:var(--err)}
.lv-none{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.dot.lv-full{background:var(--ok)} .dot.lv-partial{background:var(--warn)} .dot.lv-text{background:var(--info)} .dot.lv-backend{background:var(--err)} .dot.lv-none{background:var(--muted)}

/* ========== 转换器面板 ========== */
.conv-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.conv-head .title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:12px;font-family:var(--mono)}
.notice{border-radius:8px;padding:10px 12px;margin:10px 0;font-size:13px;border:1px solid var(--line)}
.notice.warn{background:var(--warn-weak);border-color:transparent}
.notice.info{background:var(--info-weak);border-color:transparent}
.notice.err{background:var(--err-weak);border-color:transparent}
.notice ul{margin:4px 0 0;padding-left:20px}
details.limits summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:6px}
details.limits ul{margin:6px 0;padding-left:20px;font-size:13px}

.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;cursor:pointer;transition:.15s;background:var(--panel2);margin-top:12px}
.drop:hover,.drop.dragover{border-color:var(--accent);background:var(--accent-weak)}
.drop .big{font-size:15px;font-weight:600}
.drop .accept{margin-top:6px;font-size:12px;color:var(--muted);word-break:break-word}

.filelist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.fileitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel)}
.fileitem.bad{opacity:.6;border-style:dashed}
.fileitem .fi-main{flex:1;min-width:0}
.fileitem .fi-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.fileitem .fi-meta{font-size:12px;color:var(--muted)}
.fileitem .fi-ops{display:flex;gap:2px;flex:none}
.listbar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}

.outfmts{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.opt label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.opt input[type=text],.opt input[type=number],.opt select,.opt textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.opt input[type=color]{width:46px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.opt .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);margin-top:20px}
.opt .hint{font-size:11.5px;color:var(--muted);margin-top:2px}
.opt input[type=range]{width:100%}
.actions{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}

/* ========== 预览面板 ========== */
.pv{margin-top:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel2);overflow:hidden}
.pv-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.pv-head h3{margin:0;font-size:14px;flex:1;min-width:150px}
.pv-head select{max-width:min(240px,100%);padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.pv-note{padding:8px 12px 0;font-size:12.5px;color:var(--muted)}
.pv-stale{padding:6px 12px 0;color:var(--warn)}
.pv-status{padding:8px 12px;font-size:12.5px;color:var(--muted);word-break:break-word}
.pv-status:empty{display:none}
.pv-status .bar{margin-top:6px}
.pv-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:16px}
.pv-body:empty{display:none}
.pv-body .notice{margin:0}
.pv-body .notice ul{margin:2px 0 4px}
.pv-page{margin:0;min-width:0}
.pv-page figcaption{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.pv-page figcaption span:last-child{word-break:break-all}
.pv-sheet{background:#fff;border-radius:4px;box-shadow:var(--shadow),0 0 0 1px var(--line);overflow:hidden}
.pv-sheet canvas{display:block;width:100%;height:auto}
.pv-img{display:flex;justify-content:center;align-items:center;padding:10px;border-radius:6px;border:1px solid var(--line);background:repeating-conic-gradient(rgba(128,128,128,.22) 0 25%,transparent 0 50%) 0 0/16px 16px}
.pv-img canvas{display:block;max-width:100%;max-height:70vh;width:auto;height:auto}
.pv-paper{background:#fff;color:#111;border-radius:4px;box-shadow:var(--shadow),0 0 0 1px var(--line);margin:0 auto;box-sizing:border-box}
.pv-win{overflow:hidden}
.pv-text{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.pv-info{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:13px;word-break:break-word}

/* ========== 首页总览 ========== */
.matrix{width:100%;border-collapse:collapse;font-size:13px}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.matrix th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
.matrix tr.clickable{cursor:pointer}
.matrix tr.clickable:hover td{background:var(--panel2)}
.tblwrap{overflow:auto;max-height:70vh}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* ========== 任务面板 ========== */
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:10px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.taskpanel{display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 84px)}
.taskbar{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.tasklist{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.task{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.task .t-top{display:flex;align-items:center;gap:6px}
.task .t-name{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .t-sub{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word}
.st{font-size:11.5px;border-radius:4px;padding:0 6px;flex:none}
.st-queued{background:var(--panel2);color:var(--muted)}
.st-running{background:var(--info-weak);color:var(--info)}
.st-done{background:var(--ok-weak);color:var(--ok)}
.st-error{background:var(--err-weak);color:var(--err)}
.st-canceled{background:var(--panel2);color:var(--muted)}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.bar.indet > i{width:30% !important;animation:indet 1.2s infinite ease-in-out}
@keyframes indet{0%{margin-left:-30%}100%{margin-left:100%}}
.results{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.result{display:flex;align-items:center;gap:6px;font-size:12.5px}
.result .r-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.errbox{margin-top:6px;background:var(--err-weak);border-radius:6px;padding:6px 8px;font-size:12.5px}
.errbox ul{margin:2px 0;padding-left:18px}
.logs{overflow:auto;padding:10px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-all;min-height:120px}
.logs .l-warn{color:var(--warn)} .logs .l-error{color:var(--err)} .logs .l-ok{color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:13px}

/* ========== 通知 ========== */
#toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:8px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.15);font-size:13px;animation:tin .2s}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)} .toast.error{border-left-color:var(--err)}
.toast .tt{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.toast .tb{margin-top:4px;word-break:break-word}
.toast ul{margin:4px 0 0;padding-left:18px}
.toast .x{cursor:pointer;border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* ========== 弹窗 ========== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:12px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{margin:0 0 10px}
.modal pre{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow:auto;font-family:var(--mono);font-size:12.5px}
.modal .row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.modal .row label{min-width:120px}

/* ========== 响应式 ========== */
@media (max-width:1240px){
  .layout{grid-template-columns:220px minmax(0,1fr)}
  aside.right{grid-column:1 / -1;position:static;max-height:none}
  .taskpanel{max-height:none}
  .tasklist,.logs{max-height:60vh}
}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);padding:10px 16px;gap:10px}
  header.top{position:static}
  nav.side{position:static;max-height:none}
  nav.side.collapsed .navbody{display:none}
  .navtoggle{display:flex;width:100%}
  .brand h1{font-size:15px}
  .privacy{order:3;width:100%;justify-content:center}
  .section{padding:12px}
  .opts{grid-template-columns:1fr 1fr}
}
@media (max-width:480px){
  .opts{grid-template-columns:1fr}
  .matrix .hide-sm{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">⇄</div><h1 data-i18n="appTitle">本地文件格式转换器</h1></div>

    <span class="envbar" id="envbar"></span>

        <div class="taskbar">
          <button class="btn sm primary" id="btnZipAll" data-i18n="zipAll">全部结果打包 ZIP</button>
          <button class="btn sm" id="btnCancelAll" data-i18n="cancelAll">取消全部</button>
          <button class="btn sm" id="btnClearDone" data-i18n="clearDone">清除已结束</button>

      <div id="tabLogs" class="hidden" style="display:flex;flex-direction:column;min-height:0">

        <div class="logs" id="logBox"></div>

</div>

<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
 * 本地文件格式转换器 Local File Converter
 * 结构：
 *   1. 基础工具 / 国际化 / 设置 / 日志 / 通知 / 错误诊断 / 依赖库加载
 *   2. 转换器注册表 + 界面渲染 + 任务调度
 *   3. 各类处理引擎（图片、PDF、DOCX、编码、EPUB、PPTX、OCR、FFmpeg…）
 *   4. 转换器注册（每个转换器：id、名称、输入扩展名、输出格式、选项、处理函数）
 *   5. 初始化
 * 所有文件均在浏览器内处理，CDN 仅用于加载第三方库。
 * ===================================================================== */

/* ---------------------------------------------------------------------
 * 1.1 基础工具函数
 * ------------------------------------------------------------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

/** 创建 DOM 元素的小工具：h('div', {class:'x', onclick:fn}, [子元素或文本]) */
function h(tag, attrs, children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k === 'html') el.innerHTML = v;

/** 解析页码范围："1-3,5,8-" → [[1,2,3],[5],[8..total]]；空或 all → [[1..total]] */
function parseRanges(str, total) {

    const g = [];

}

function fmtDate(d, pattern) {

function log(msg, level = 'info') {

  const line = { time: `${pad(d.getHours(), 2)}:${pad(d.getMinutes(), 2)}:${pad(d.getSeconds(), 2)}`, msg: String(msg), level };
  state.logs.push(line);
  if (state.logs.length > 1500) state.logs.splice(0, 300);

  if (box) {
    box.appendChild(h('div', { class: 'l-' + level }, `[${line.time}] ${line.msg}`));
    while (box.childNodes.length > 1500) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }
}

  const close = h('button', { class: 'x', title: t('close'), 'aria-label': t('close') }, '×');
  const el = h('div', { class: 'toast ' + type }, [
    h('div', { class: 'tt' }, [h('span', null, title), close]),
    body ? h('div', { class: 'tb' }, body) : null,
    causes && causes.length ? h('div', { class: 'tb' }, [h('b', null, t('causes') + '：'), h('ul', null, causes.map(c => h('li', null, L(c))))]) : null,
    tips && tips.length ? h('div', { class: 'tb' }, [h('b', null, t('suggestions') + '：'), h('ul', null, tips.map(c => h('li', null, L(c))))]) : null,
  ]);
  close.onclick = () => el.remove();
  box.appendChild(el);
  const ms = timeout ?? (type === 'error' ? 15000 : type === 'warn' ? 9000 : 4000);

}

const CDN_HOSTS = {
  jsdelivr: (pkg, ver, path) => `https://cdn.jsdelivr.net/npm/${pkg}@${ver}/${path}`,
  unpkg: (pkg, ver, path) => `https://unpkg.com/${pkg}@${ver}/${path}`,
  npmmirror: (pkg, ver, path) => `https://registry.npmmirror.com/${pkg}/${ver}/files/${path}`
};
function cdnOrder() {
  const pref = state.settings.cdn;
  const all = /^zh/i.test(navigator.language || '') ? ['jsdelivr', 'npmmirror', 'unpkg'] : ['jsdelivr', 'unpkg', 'npmmirror'];
  if (CDN_HOSTS[pref]) return [pref, ...all.filter(x => x !== pref)];
  return all;
}
const LIBS = {
  pdflib: { pkg: 'pdf-lib', ver: '1.17.1', path: 'dist/pdf-lib.min.js', global: 'PDFLib' },
  pdfjs: {
    pkg: 'pdfjs-dist', ver: '3.11.174', path: 'build/pdf.min.js', global: 'pdfjsLib',
    init(host) {

      window.pdfjsLib.GlobalWorkerOptions.workerSrc = u('build/pdf.worker.min.js');
      LIBS.pdfjs.cMapUrl = u('cmaps/');

  marked: { pkg: 'marked', ver: '12.0.2', path: 'marked.min.js', global: 'marked' },
  turndown: { pkg: 'turndown', ver: '7.1.3', path: 'dist/turndown.js', global: 'TurndownService' },
  turndownGfm: { pkg: 'turndown-plugin-gfm', ver: '1.0.2', path: 'dist/turndown-plugin-gfm.js', global: 'turndownPluginGfm', deps: ['turndown'] },
  tesseract: { pkg: 'tesseract.js', ver: '5.1.1', path: 'dist/tesseract.min.js', global: 'Tesseract' },

};
function loadScript(url, timeoutMs = 90000) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url; s.async = true;
    const timer = setTimeout(() => { s.remove(); rej(new Error('Timeout loading ' + url)); }, timeoutMs);
    s.onload = () => { clearTimeout(timer); res(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); rej(new Error('Failed to load ' + url)); };
    document.head.appendChild(s);
  });
}
const libPromises = {};
function loadLib(name) {
  if (libPromises[name]) return libPromises[name];
  const def = LIBS[name];
  if (!def) return Promise.reject(new Error('Unknown lib ' + name));
  const p = (async () => {
    if (def.deps) for (const d of def.deps) await loadLib(d);
    if (window[def.global] && def.loadedFrom) return window[def.global];
    let lastErr;
    for (const host of cdnOrder()) {
      const url = CDN_HOSTS[host](def.pkg, def.ver, def.path);
      try {
        log(`${t('loadingLib')} ${def.pkg}@${def.ver} ← ${host}`);
        await loadScript(url);
        if (window[def.global]) {
          def.loadedFrom = host;
          if (def.init) def.init(host);
          log(`${t('libLoaded')} ${def.pkg}`, 'ok');
          return window[def.global];
        }
        lastErr = new Error('Global not found after loading ' + url);
      } catch (e) { lastErr = e; log(`${def.pkg} @ ${host}: ${e.message}`, 'warn'); }
    }
    const err = new Error(`LIB_LOAD_FAILED: ${name} (${lastErr && lastErr.message})`);
    err.code = 'LIB_LOAD_FAILED'; err.lib = def.pkg;
    throw err;
  })();
  libPromises[name] = p;
  p.catch(() => { delete libPromises[name]; });   // 失败后允许重试
  return p;
}
const loadLibs = names => Promise.all(names.map(loadLib));

const Registry = {
  list: [], map: {},
  /** 注册转换器。必填：id、cat、name、level、inputs；可运行的转换器需要 outputs 与 run */
  register(def) {
    if (!def || !def.id || !def.cat || !def.name || !def.level) throw new Error('Invalid converter definition');
    if (this.map[def.id]) throw new Error('Duplicate converter id ' + def.id);
    def.inputs = def.inputs || [];
    def.outputs = (def.outputs || []).map(o => typeof o === 'string' ? { v: o, l: o.toUpperCase() } : o);
    def.options = def.options || [];
    def.limits = def.limits || [];
    def.libs = def.libs || [];
    def.runnable = typeof def.run === 'function';
    this.list.push(def); this.map[def.id] = def;
    return def;
  },
  get(id) { return this.map[id]; },
  byCat(cat) { return this.list.filter(c => c.cat === cat); },
  /** 根据扩展名推荐可用转换器 */
  forExt(ext) { return this.list.filter(c => c.runnable && c.inputs.includes(ext)); }
};

/** 取得转换器当前选项值（含默认值） */
function getOpts(conv) {
  if (!state.optsByConv[conv.id]) {

  }
  return state.optsByConv[conv.id];
}
function getOut(conv) {
  if (!state.outByConv[conv.id] && conv.outputs.length) state.outByConv[conv.id] = (conv.defOut || conv.outputs[0].v);

}

function renderOptions(conv, box) {
  box.innerHTML = '';
  const opts = getOpts(conv);
  const out = getOut(conv);
  const visible = conv.options.filter(op => !op.show || op.show(opts, out));
  if (!visible.length) return;
  box.appendChild(h('h3', null, t('options')));
  const grid = h('div', { class: 'opts' });
  const rerender = () => renderOptions(conv, box);
  for (const op of visible) {
    const id = 'op_' + conv.id + '_' + op.id;
    let input;
    const set = v => { opts[op.id] = v; if (conv.options.some(x => x.show)) rerender(); };
    if (op.type === 'select') {
      input = h('select', { id }, op.choices.map(ch => h('option', { value: String(ch[0]) }, state.lang === 'en' ? (ch[2] ?? ch[1]) : ch[1])));
      input.value = String(opts[op.id]);
      input.onchange = () => { const raw = input.value; const m = op.choices.find(c => String(c[0]) === raw); set(m ? m[0] : raw); };
    } else if (op.type === 'checkbox') {
      input = h('input', { type: 'checkbox', id });
      input.checked = !!opts[op.id];
      input.onchange = () => set(input.checked);
      grid.appendChild(h('div', { class: 'opt' }, [h('label', { class: 'chk', for: id }, [input, L(op.label)]), op.hint ? h('div', { class: 'hint' }, L(op.hint)) : null]));
      continue;
    } else if (op.type === 'number' || op.type === 'range') {
      input = h('input', { type: op.type, id, min: op.min, max: op.max, step: op.step || 1, value: opts[op.id] });
      const lab = op.type === 'range' ? h('span', null, ' ' + opts[op.id]) : null;
      input.oninput = () => { if (lab) lab.textContent = ' ' + input.value; };
      input.onchange = () => { let v = parseFloat(input.value); if (!isFinite(v)) v = op.def; if (op.min !== undefined) v = Math.max(op.min, v); if (op.max !== undefined) v = Math.min(op.max, v); input.value = v; set(v); };
      grid.appendChild(h('div', { class: 'opt' }, [h('label', { for: id }, [L(op.label), lab]), input, op.hint ? h('div', { class: 'hint' }, L(op.hint)) : null]));
      continue;
    } else if (op.type === 'color') {
      input = h('input', { type: 'color', id, value: opts[op.id] });
      input.onchange = () => set(input.value);
    } else if (op.type === 'textarea') {
      input = h('textarea', { id, rows: 3 }); input.value = opts[op.id] ?? '';
      input.onchange = () => set(input.value);
    } else {
      input = h('input', { type: 'text', id, placeholder: op.ph ? L(op.ph) : '' }); input.value = opts[op.id] ?? '';
      input.onchange = () => set(input.value);
    }
    grid.appendChild(h('div', { class: 'opt' }, [h('label', { for: id }, L(op.label)), input, op.hint ? h('div', { class: 'hint' }, L(op.hint)) : null]));
  }
  box.appendChild(grid);
}

/** 添加文件（去重 + 大文件内存提示） */

  if (!files || !files.length) return;
  const conv = Registry.get(state.view);
  let added = 0, dup = 0;
  for (const file of files) {
    if (!file || typeof file.size !== 'number') continue;
    if (state.files.some(f => f.file.name === file.name && f.file.size === file.size && f.file.lastModified === file.lastModified)) { dup++; continue; }
    state.files.push({ id: uid('f'), file, info: {} });
    added++;
    const warnAt = (conv && conv.warnSize) || 300 * 1048576;
    if (file.size > warnAt) {
      toast({
        type: 'warn', title: `${t('bigFile')}: ${file.name} (${fmtSize(file.size)})`,
        body: L(['浏览器内处理需要把文件完整读入内存，可能占用文件体积数倍的内存，页面可能变慢或崩溃。', 'Browser-side processing loads the whole file into memory (often several times its size). The page may slow down or crash.']),
        tips: [['在设置中把并发数调为 1', 'Set concurrency to 1'], ['关闭其它占内存的标签页', 'Close other heavy tabs'], ['超大文件建议使用桌面软件', 'Use desktop software for huge files']]
      });
    }
  }
  const total = state.files.reduce((a, f) => a + f.file.size, 0);
  if (total > 1.5 * 1073741824) toast({ type: 'warn', title: t('bigFile'), body: L([`当前文件总大小 ${fmtSize(total)}，建议分批转换。`, `Total size ${fmtSize(total)}. Consider converting in batches.`]) });

/* =====================================================================
 * 2.4 任务调度（并发限制、独占资源、取消）
 * ===================================================================== */
let runningCount = 0;
const runningExclusive = new Set();
let batchStats = { ok: 0, fail: 0 };

function startConversion(conv) {
  const files = state.files.filter(f => accepts(conv, f.file)).map(f => f.file);
  if (!files.length) { toast({ type: 'warn', title: t('noCompatible'), body: `${t('accept')}: ${conv.inputs.join(', ')}` }); return; }
  const opts = { ...getOpts(conv) };
  const output = getOut(conv);
  const mode = typeof conv.mode === 'function' ? conv.mode(opts, output) : (conv.mode || 'each');
  if (mode === 'batch') addJob(conv, files, opts, output);
  else files.forEach(f => addJob(conv, [f], opts, output));
  toast({ type: 'info', title: t('jobsAdded'), body: `${L(conv.name)} → ${output ? output.toUpperCase() : ''}`, timeout: 2500 });
  // 移动端自动滚动到任务区
  if (window.matchMedia('(max-width: 1240px)').matches) $('aside.right').scrollIntoView({ behavior: 'smooth' });
  pump();
}

function addJob(conv, files, opts, output) {
  const job = {
    id: uid('job'), conv, files, opts, output, status: 'queued', progress: 0, indeterminate: true, msg: '',
    results: [], error: null, ctrl: new AbortController(),
    title: files.length > 1 ? `${t('batchJob')}: ${files.length} ${t('files')}` : files[0].name
  };
  state.jobs.unshift(job);
  renderTasks();
  return job;
}

function pump() {
  const queued = state.jobs.filter(j => j.status === 'queued').reverse();   // 先加入的先执行
  for (const job of queued) {
    if (runningCount >= state.settings.concurrency) break;
    if (job.conv.exclusive && runningExclusive.has(job.conv.exclusive)) continue;
    runJob(job);
  }
}

async function runJob(job) {
  const conv = job.conv;
  runningCount++;
  if (conv.exclusive) runningExclusive.add(conv.exclusive);
  job.status = 'running'; job.started = Date.now(); job.msg = '';
  renderTasks();
  const signal = job.ctrl.signal;
  const ctx = {
    files: job.files, file: job.files[0], opts: job.opts, output: job.output, signal, job,
    check() { if (signal.aborted) throw abortErr(); },
    progress(p, msg) {
      if (p === null || p === undefined) job.indeterminate = true;
      else { job.indeterminate = false; job.progress = clamp(p, 0, 1); }
      if (msg !== undefined) job.msg = msg;
      updateJobUI(job);
    },
    log(m, lvl) { log(`[${L(conv.name)}] ${m}`, lvl); },
    warn(m) { job.warnings = job.warnings || []; job.warnings.push(m); log(`[${L(conv.name)}] ${m}`, 'warn'); },
    onAbort(fn) { if (signal.aborted) fn(); else signal.addEventListener('abort', fn, { once: true }); }
  };
  try {
    if (conv.libs.length) { ctx.progress(null, t('loadingLib') + '…'); await loadLibs(conv.libs); }
    ctx.check();
    const res = await conv.run(ctx);
    ctx.check();
    const used = new Set();
    job.results = (Array.isArray(res) ? res : [res]).filter(r => r && r.blob).map(r => {
      let name = safeName(r.name || 'output');
      if (used.has(name)) { const b = baseName(name), e = getExt(name); let i = 2; while (used.has(`${b}_${i}${e ? '.' + e : ''}`)) i++; name = `${b}_${i}${e ? '.' + e : ''}`; }
      used.add(name);
      return { name, blob: r.blob };
    });
    if (!job.results.length) throw userErr('NO_OUTPUT', ['没有生成任何输出', 'No output was produced'], { causes: [['文件内容为空或所选页码/工作表不存在', 'Empty content or selected pages/sheets do not exist']] });
    job.status = 'done'; job.progress = 1; job.indeterminate = false;
    job.msg = `${job.results.length} ${t('results')} · ${fmtSize(job.results.reduce((a, r) => a + r.blob.size, 0))} · ${((Date.now() - job.started) / 1000).toFixed(1)}s`;
    batchStats.ok++;
    log(`✓ ${job.title} → ${job.results.map(r => r.name).slice(0, 5).join(', ')}${job.results.length > 5 ? '…' : ''}`, 'ok');
  } catch (e) {
    if (isAbort(e) || signal.aborted) { job.status = 'canceled'; job.msg = t('canceled'); }
    else {
      job.status = 'error';
      job.error = diagnose(e, conv);
      batchStats.fail++;
      log(`✗ ${job.title}: ${e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e}`, 'error');
      toast({ type: 'error', title: `${t('taskFail')}: ${job.title}`, body: `${t('reason')}：${job.error.reason}`, causes: job.error.causes, tips: job.error.tips });
    }
  } finally {
    runningCount--;
    if (conv.exclusive) runningExclusive.delete(conv.exclusive);
    renderTasks();
    pump();
    if (!state.jobs.some(j => j.status === 'running' || j.status === 'queued') && (batchStats.ok || batchStats.fail)) {
      if (batchStats.ok) toast({ type: batchStats.fail ? 'warn' : 'ok', title: t('taskDone'), body: `✓ ${batchStats.ok}  ✗ ${batchStats.fail}` });
      batchStats = { ok: 0, fail: 0 };
    }
  }
}

function cancelJob(job) {
  if (job.status === 'queued') { job.status = 'canceled'; job.msg = t('canceled'); renderTasks(); return; }
  if (job.status === 'running') { job.msg = L(['正在取消…', 'Canceling…']); job.ctrl.abort(); updateJobUI(job); }
}
function retryJob(job) {
  job.status = 'queued'; job.error = null; job.results = []; job.progress = 0; job.indeterminate = true; job.msg = '';
  job.ctrl = new AbortController();
  renderTasks(); pump();
}

/* =====================================================================
 * 2.5 任务面板渲染

let renderTasksQueued = false;

}

      h('div', { class: 't-sub' }, `${L(job.conv.name)}${job.output ? ' → ' + job.output.toUpperCase() : ''}`),
      job.status === 'running' || job.status === 'queued' ? bar : null,

    ]);
    if (job.warnings && job.warnings.length) root.appendChild(h('div', { class: 't-sub', style: 'color:var(--warn)' }, '⚠ ' + job.warnings.slice(-3).join(' / ')));
    if (job.status === 'error' && job.error) {

        h('div', null, [h('b', null, t('reason') + '：'), job.error.reason]),

        job.error.tips.length ? h('div', null, [h('b', null, t('suggestions') + '：'), h('ul', null, job.error.tips.map(c => h('li', null, L(c))))]) : null
      ]));

      const rs = h('div', { class: 'results' });
      job.results.slice(0, 8).forEach(r => rs.appendChild(h('div', { class: 'result' }, [
        h('span', { class: 'r-name', title: r.name }, '📎 ' + r.name), h('span', { class: 'muted' }, fmtSize(r.blob.size)),
        h('button', { class: 'btn sm', onclick: () => downloadBlob(r.blob, r.name) }, '⬇ ' + t('download'))
      ])));
      if (job.results.length > 8) rs.appendChild(h('div', { class: 'muted small' }, `… +${job.results.length - 8}`));
      if (job.results.length > 1) rs.appendChild(h('div', null, h('button', { class: 'btn sm primary', onclick: () => zipAndDownload(job.results, baseName(job.files[0].name) + '_' + (job.output || 'out') + '.zip') }, '🗜 ' + t('downloadZip') + ` (${job.results.length})`)));
      root.appendChild(rs);
    }
    job._el = { bar, sub, st };
    box.appendChild(root);
  }
}

function updateJobUI(job) {

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name, style: 'display:none' });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);
}
const STORE_EXT = new Set(['png', 'jpg', 'jpeg', 'webp', 'gif', 'avif', 'mp4', 'mkv', 'webm', 'mov', 'avi', 'flv', 'mp3', 'm4a', 'ogg', 'opus', 'flac', 'zip', 'docx', 'xlsx', 'pptx', 'epub', 'ods']);
async function zipAndDownload(results, zipName) {
  if (!results.length) { toast({ type: 'warn', title: t('nothingToZip') }); return; }
  try {
    await loadLib('jszip');
    toast({ type: 'info', title: t('zipping'), timeout: 2500 });
    const zip = new JSZip();
    const used = new Set();
    for (const r of results) {
      let name = r.name, i = 2;
      while (used.has(name)) name = `${baseName(r.name)}_${i++}.${getExt(r.name)}`;
      used.add(name);
      zip.file(name, r.blob, { compression: STORE_EXT.has(getExt(name)) ? 'STORE' : 'DEFLATE' });
    }
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
    downloadBlob(blob, zipName);
    toast({ type: 'ok', title: t('zipDone'), body: `${zipName} · ${fmtSize(blob.size)}` });
  } catch (e) {
    const d = diagnose(e);
    toast({ type: 'error', title: t('error'), body: d.reason, causes: d.causes, tips: d.tips });
  }
}
function zipAll() {
  const results = state.jobs.filter(j => j.status === 'done').flatMap(j => j.results);
  const d = new Date();
  zipAndDownload(results, `converted_${d.getFullYear()}${pad(d.getMonth() + 1, 2)}${pad(d.getDate(), 2)}_${pad(d.getHours(), 2)}${pad(d.getMinutes(), 2)}${pad(d.getSeconds(), 2)}.zip`);
}

const PREVIEW_PAGES = 3;
const PREVIEW_CATS = new Set(['pdf', 'word', 'image', 'ocr', 'ebook', 'ppt']);
const PV_TRIM_PDF = new Set(['pdf-merge', 'to-pptx']);   // 先把输入 PDF 裁成前 3 页的转换器
const PV_IMG_EXT = new Set(['jpg', 'jpeg', 'png', 'webp', 'avif', 'gif', 'bmp', 'ico', 'tif', 'tiff']);
const PV_TEXT_EXT = new Set(['txt', 'md', 'markdown', 'csv', 'tsv', 'json', 'xml', 'yaml', 'yml', 'srt', 'vtt', 'log']);
const PV_TEXT_LINES = 45, PV_TEXT_CHARS = 4000;   // 纯文本按约 45 行 / 4000 字估算为一页
const PV_PAPER_W = 680, PV_PAPER_PAD = 40;         // 文档类预览的纸张内容宽度与边距（px）
const canPreview = conv => !!conv && conv.runnable && PREVIEW_CATS.has(conv.cat);

const Preview = { conv: null, el: null, ctrl: null, task: null, running: false, startId: null, sig: '' };

const pvPageLabel = n => `${L(['第 ', 'Page '])}${n}${L([' 页', ''])}`;
const pvSig = conv => JSON.stringify([getOut(conv), getOpts(conv)]);

/** 视图切换时调用：离开当前转换器则取消并关闭预览 */
function previewOnView(id) {
  if (Preview.conv && Preview.conv.id !== id) closePreview();
}
function closePreview() {
  if (Preview.ctrl) Preview.ctrl.abort();
  if (Preview.el) Preview.el.remove();
  Object.assign(Preview, { conv: null, el: null, ctrl: null, running: false, startId: null, sig: '' });
}

/** 在转换器视图中挂载预览面板（重绘视图时保留已生成的预览内容） */
function mountPreview(view, conv) {
  if (!Preview.el || Preview.conv !== conv) return;
  renderPreviewHead(conv);
  const stale = Preview.el.querySelector('.pv-stale');
  if (stale) stale.classList.toggle('hidden', Preview.running || !Preview.sig || Preview.sig === pvSig(conv));
  view.appendChild(Preview.el);
  fitPreviewPapers();
}

function ensurePreviewPanel(conv) {
  if (Preview.el && Preview.conv === conv) return Preview.el;
  if (Preview.el) Preview.el.remove();
  Preview.conv = conv;
  Preview.el = h('div', { class: 'pv', id: 'previewPanel' }, [
    h('div', { class: 'pv-head' }),
    h('div', { class: 'pv-note' }, L(['预览在本地浏览器中生成，只转换前 3 页，不会上传文件，也不会加入任务列表。确认效果后再点击“开始转换”导出完整文件。', 'The preview is generated locally in your browser and converts only the first 3 pages. Nothing is uploaded or added to the task list. Click "Convert" afterwards to export the full file.'])),
    h('div', { class: 'pv-stale muted small hidden' }, '⚠ ' + L(['输出格式或选项已更改，点击“重新预览”查看最新效果', 'Output or options changed — click "Preview again" to refresh'])),
    h('div', { class: 'pv-status' }),
    h('div', { class: 'pv-body' })
  ]);
  const view = $('#view');
  if (view) view.appendChild(Preview.el);
  return Preview.el;
}

function renderPreviewHead(conv) {
  const head = Preview.el.querySelector('.pv-head');
  head.innerHTML = '';
  const files = state.files.filter(f => accepts(conv, f.file));
  const mode = pvMode(conv);
  let sel = null;
  if (mode === 'each' && files.length > 1) {
    sel = h('select', { title: L(['从哪个文件开始预览', 'File to preview']), 'aria-label': L(['预览文件', 'Preview file']) }, files.map(f => h('option', { value: f.id }, f.file.name)));
    sel.value = files.some(f => f.id === Preview.startId) ? Preview.startId : files[0].id;
    sel.onchange = () => { Preview.startId = sel.value; runPreview(conv); };
  }
  head.append(
    h('h3', null, '👁 ' + L(['预览前 3 页', 'Preview first 3 pages'])),
    sel || '',
    Preview.running
      ? h('button', { class: 'btn sm', onclick: () => { if (Preview.ctrl) Preview.ctrl.abort(); } }, t('cancel'))
      : h('button', { class: 'btn sm', onclick: () => runPreview(conv) }, '↻ ' + L(['重新预览', 'Preview again'])),
    h('button', { class: 'btn ghost sm', title: t('close'), 'aria-label': t('close'), onclick: closePreview }, '✕')
  );
}

const pvMode = conv => { const o = getOpts(conv); return typeof conv.mode === 'function' ? conv.mode(o, getOut(conv)) : (conv.mode || 'each'); };

function pvStatus(msg, p) {
  const box = Preview.el && Preview.el.querySelector('.pv-status');
  if (!box) return;
  box.innerHTML = '';
  if (msg) box.appendChild(h('div', null, msg));
  if (p !== undefined) box.appendChild(h('div', { class: 'bar' + (p === null ? ' indet' : '') }, h('i', { style: `width:${Math.round((p || 0) * 100)}%` })));
}

/** 生成预览 */
async function runPreview(conv) {
  if (!canPreview(conv)) return;
  const files = state.files.filter(f => accepts(conv, f.file));
  if (!files.length) { toast({ type: 'warn', title: t('noCompatible'), body: `${t('accept')}: ${conv.inputs.join(', ')}` }); return; }
  // 取消上一次预览，并等它退出（释放 OCR 等独占资源）后再开始
  const prev = Preview.task;
  if (Preview.ctrl) Preview.ctrl.abort();
  const ctrl = new AbortController();
  Preview.ctrl = ctrl;
  Preview.task = (async () => { if (prev) await prev.catch(() => { }); if (Preview.ctrl === ctrl) await pvRun(conv, files, ctrl); })();
  return Preview.task;
}

async function pvRun(conv, files, ctrl) {
  const el = ensurePreviewPanel(conv);
  const body = el.querySelector('.pv-body');
  body.innerHTML = '';
  Object.assign(Preview, { ctrl, running: true, sig: pvSig(conv) });
  renderPreviewHead(conv);
  el.querySelector('.pv-stale').classList.add('hidden');
  if (el.getBoundingClientRect().top > window.innerHeight - 80) el.scrollIntoView({ behavior: 'smooth', block: 'start' });

  const opts = { ...getOpts(conv) };
  const output = getOut(conv);
  const mode = pvMode(conv);
  const signal = ctrl.signal;
  const warns = [];
  let stage = 'convert', base = 0, span = 1, holdsExclusive = false;
  const t0 = Date.now();
  const ctx = {
    files: [], file: null, opts, output, signal, job: { warnings: warns }, preview: true, maxPages: PREVIEW_PAGES,
    check() { if (signal.aborted) throw abortErr(); },
    progress(p, msg) { if (Preview.ctrl === ctrl) pvStatus(msg || L(['正在生成预览…', 'Generating preview…']), p === null || p === undefined ? null : base + span * clamp(p, 0, 1)); },
    log(m, lvl) { log(`[${L(['预览', 'Preview'])} · ${L(conv.name)}] ${m}`, lvl); },
    warn(m) { warns.push(m); log(`[${L(['预览', 'Preview'])} · ${L(conv.name)}] ${m}`, 'warn'); },
    onAbort(fn) { if (signal.aborted) fn(); else signal.addEventListener('abort', fn, { once: true }); }
  };
  let shown = 0, srcTotal = 0;
  try {
    // OCR 等独占资源：正式任务在用时不预览；预览期间占用，避免与任务抢同一个引擎
    if (conv.exclusive) {
      if (runningExclusive.has(conv.exclusive)) throw userErr('PREVIEW_BUSY', ['有同类任务（OCR）正在运行，暂时无法预览', 'A task using the same engine (OCR) is running'], { tips: [['等待右侧任务完成后再预览，或先取消该任务', 'Wait for the running task to finish, or cancel it, then preview again']] });
      runningExclusive.add(conv.exclusive); holdsExclusive = true;
    }
    ctx.progress(null, conv.libs.length ? t('loadingLib') + '…' : undefined);
    if (conv.libs.length) await loadLibs(conv.libs);
    ctx.check();
    // 要运行的文件组：批量模式取前 3 个文件合成一次；逐个模式从所选文件开始，最多 3 个文件
    let groups;
    if (mode === 'batch') groups = [files.slice(0, PREVIEW_PAGES).map(f => f.file)];
    else {
      const start = Math.max(0, files.findIndex(f => f.id === Preview.startId));
      groups = files.slice(start, start + PREVIEW_PAGES).map(f => [f.file]);
    }
    for (let gi = 0; gi < groups.length && shown < PREVIEW_PAGES; gi++) {
      ctx.check();
      stage = 'convert';
      base = gi / groups.length; span = 0.85 / groups.length;
      const inFiles = await pvLimitInput(conv, groups[gi], opts, ctx);
      if (inFiles.total) srcTotal = Math.max(srcTotal, inFiles.total);
      ctx.files = inFiles.files; ctx.file = inFiles.files[0];
      ctx.progress(0, L(['正在转换前 3 页…', 'Converting the first 3 pages…']));
      const res = await conv.run({ ...ctx, opts: inFiles.opts });
      ctx.check();
      const results = (Array.isArray(res) ? res : [res]).filter(r => r && r.blob);
      if (!results.length) throw userErr('NO_OUTPUT', ['没有生成任何输出', 'No output was produced'], { causes: [['文件内容为空或所选页码不存在', 'Empty content or the selected pages do not exist']] });
      stage = 'render';
      ctx.progress(0.9, L(['正在渲染预览…', 'Rendering preview…']));
      for (const r of results) {
        if (shown >= PREVIEW_PAGES) break;
        const items = await pvRenderResult(r, PREVIEW_PAGES - shown, ctx, groups[gi], results.length > 1);
        ctx.check();
        for (const it of items) {
          shown += it.pages === undefined ? 1 : it.pages;
          body.appendChild(it.node);
        }
      }
    }
    fitPreviewPapers();
    const secs = ((Date.now() - t0) / 1000).toFixed(1);
    const msg = [`✓ ${L(['预览完成', 'Preview ready'])}`, `${L(['显示', 'showing'])} ${shown} ${L(['页', shown === 1 ? 'page' : 'pages'])}`, `${secs}s`];
    if (srcTotal > PREVIEW_PAGES) msg.push(L([`原文件共 ${srcTotal} 页，正式转换将处理全部所选页面`, `the source has ${srcTotal} pages; the full conversion processes all selected pages`]));
    pvStatus(msg.join(' · '));
    if (warns.length) Preview.el.querySelector('.pv-status').appendChild(h('div', { style: 'color:var(--warn);margin-top:4px' }, '⚠ ' + [...new Set(warns)].slice(-3).join(' / ')));
  } catch (e) {
    if (Preview.ctrl !== ctrl) return;   // 已被新的预览取代
    if (isAbort(e) || signal.aborted) { pvStatus(L(['预览已取消', 'Preview canceled'])); }
    else {
      const d = diagnose(e, conv);
      log(`✗ ${L(['预览失败', 'Preview failed'])}: ${e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e}`, 'error');
      pvStatus('');
      const title = stage === 'render'
        ? L(['转换成功，但无法在页面中显示该结果的预览', 'The conversion worked, but this result cannot be shown as a preview'])
        : L(['预览失败', 'Preview failed']);
      const tips = stage === 'render' ? [['可以直接点击“开始转换”，下载后用对应软件查看效果', 'You can still click "Convert" and open the downloaded file in a suitable app'], ...d.tips] : d.tips;
      body.prepend(h('div', { class: 'notice err' }, [
        h('div', null, [h('b', null, title + '：'), d.reason]),
        d.causes.length ? h('div', null, [h('b', null, t('causes') + '：'), h('ul', null, d.causes.map(c => h('li', null, L(c))))]) : null,
        tips.length ? h('div', null, [h('b', null, t('suggestions') + '：'), h('ul', null, tips.map(c => h('li', null, L(c))))]) : null
      ]));
    }
  } finally {
    if (holdsExclusive) { runningExclusive.delete(conv.exclusive); pump(); }
    if (Preview.ctrl === ctrl) {
      Preview.running = false;
      if (Preview.el && Preview.conv === conv) renderPreviewHead(conv);
    }
  }
}

/** 缩小输入：返回 { files, opts, total }，total 为源文件页数（已知时） */
async function pvLimitInput(conv, files, opts, ctx) {
  const o = { ...opts };
  let total = 0;
  if (conv.options.includes(OPT_PAGES)) {
    // 页码范围选项：在用户所选范围内取前 3 页
    const f = files[0], ext = getExt(f.name);
    if (ext === 'pdf') {
      const pdf = await openPdf(await f.arrayBuffer(), o.password);
      total = pdf.numPages; pdf.destroy();
    } else if (['pptx', 'ppsx', 'potx'].includes(ext)) {
      total = (await openPptx(await f.arrayBuffer())).slides.length;
    }
    if (total) o.pages = flatPages(o.pages, total).slice(0, PREVIEW_PAGES).join(',');
    return { files, opts: o, total };
  }
  if (PV_TRIM_PDF.has(conv.id)) {
    const out = [];
    for (const f of files) {
      if (getExt(f.name) !== 'pdf') { out.push(f); continue; }
      const r = await pvTrimPdf(f, PREVIEW_PAGES);
      total = Math.max(total, r.total);
      out.push(r.file);
    }
    return { files: out, opts: o, total };
  }
  return { files, opts: o, total };
}
/** 用 pdf-lib 把 PDF 裁成前 n 页；加密或解析失败时原样返回，由转换器给出原有的错误提示 */
async function pvTrimPdf(file, n) {
  try {
    await loadLib('pdflib');
    const src = await PDFLib.PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true, updateMetadata: false });
    const total = src.getPageCount();
    if (src.isEncrypted || total <= n) return { file, total };
    const out = await PDFLib.PDFDocument.create();
    (await out.copyPages(src, Array.from({ length: n }, (_, i) => i))).forEach(p => out.addPage(p));
    return { file: new File([await out.save()], file.name, { type: 'application/pdf', lastModified: file.lastModified }), total };
  } catch (e) { return { file, total: 0 }; }
}

/* ---------- 结果渲染：每种输出格式渲染最多 max 页 ---------- */
function pvFigure(label, extra, content) {
  return h('figure', { class: 'pv-page' }, [h('figcaption', null, [h('span', null, label), extra ? h('span', null, extra) : null]), content]);
}
async function pvRenderResult(r, max, ctx, srcFiles, multi) {
  const ext = getExt(r.name);
  const tag = `${r.name} · ${fmtSize(r.blob.size)}`;
  if (ext === 'pdf') return pvRenderPdf(r, max, ctx, tag, multi);
  if (PV_IMG_EXT.has(ext)) {
    const c = await decodeToCanvas(new File([r.blob], r.name), ctx);
    const src = srcFiles.length === 1 && PV_IMG_EXT.has(getExt(srcFiles[0].name)) ? srcFiles[0] : null;
    const cmp = src ? ` · ${L(['原文件', 'original'])} ${fmtSize(src.size)}${r.blob.size !== src.size ? ` (${r.blob.size < src.size ? '−' : '+'}${Math.abs(Math.round((1 - r.blob.size / src.size) * 100))}%)` : ''}` : '';
    return [{ node: pvFigure(r.name, `${c.width}×${c.height}px · ${fmtSize(r.blob.size)}${cmp}`, h('div', { class: 'pv-img' }, c)) }];
  }
  if (ext === 'docx') {
    await loadLib('mammoth');
    const root = await docxToHtmlRoot(new File([r.blob], r.name), ctx);
    return pvHtmlPages(root.innerHTML, max, tag, L(['Word 文档没有固定分页，以下按 A4 页面估算显示', 'Word documents have no fixed pages; shown as estimated A4 pages']));
  }
  if (ext === 'epub') {
    const book = await readEpub(await r.blob.arrayBuffer(), { images: true }, ctx);
    const toc = book.chapters.map((c, i) => c.title || L(['第 ', 'Chapter ']) + (i + 1) + L([' 章', ''])).slice(0, 12);
    const info = `《${book.title}》${book.author ? ' · ' + book.author : ''} · ${book.chapters.length} ${L(['章', 'chapters'])}：${toc.join(' / ')}${book.chapters.length > 12 ? ' …' : ''}`;
    const html = book.chapters.map(c => `<section>${sanitizeHtml(c.html).innerHTML}</section>`).join('<div class="pdf-pagebreak"></div>');
    const pages = await pvHtmlPages(html, max, tag, L(['电子书为流式排版，以下按 A4 页面估算显示（每章另起一页）', 'E-books are reflowable; shown as estimated A4 pages (each chapter starts a new page)']));
    return [{ node: h('div', { class: 'pv-info' }, info), pages: 0 }, ...pages];
  }
  if (ext === 'pptx') {
    const P = await openPptx(await r.blob.arrayBuffer());
    const out = [];
    for (let i = 0; i < Math.min(max, P.slides.length); i++) {
      ctx.check();
      const c = await renderSlide(await loadSlide(P, P.slides[i]), 1280);
      out.push({ node: pvFigure(`${L(['幻灯片 ', 'Slide '])}${i + 1} / ${P.slides.length}`, i === 0 ? tag : '', h('div', { class: 'pv-sheet' }, c)) });
    }
    return out;
  }
  if (ext === 'html' || ext === 'htm') return pvHtmlPages(sanitizeHtml(await r.blob.text()).innerHTML, max, tag, L(['网页没有固定分页，以下按 A4 页面估算显示', 'Web pages have no fixed pages; shown as estimated A4 pages']));
  if (PV_TEXT_EXT.has(ext)) return pvTextPages(await r.blob.text(), max, tag);
  return [{ node: h('div', { class: 'pv-info' }, `📎 ${tag} — ${L([`.${ext} 格式无法在页面中直接预览，正式转换后可下载查看`, `.${ext} files cannot be previewed in the page; convert and download to view`])}`) }];
}

async function pvRenderPdf(r, max, ctx, tag, multi) {
  const pdf = await openPdf(await r.blob.arrayBuffer());
  const out = [];
  try {
    const n = Math.min(max, pdf.numPages);
    for (let i = 1; i <= n; i++) {
      ctx.check();
      const page = await pdf.getPage(i);
      const w = page.getViewport({ scale: 1 }).width;
      page.cleanup();
      const c = await renderPdfPage(pdf, i, clamp(1100 / w, 0.5, 2.5), ctx);
      // 多个输出文件（如拆分）时以文件名标注
      out.push({ node: pvFigure(multi ? `${r.name} · ${pvPageLabel(i)}` : pvPageLabel(i), multi ? fmtSize(r.blob.size) : i === 1 ? tag : '', h('div', { class: 'pv-sheet' }, c)) });
    }
  } finally { pdf.destroy(); }
  return out;
}

/** HTML → 按 A4 比例分页，取前 max 页（分页算法与 htmlToPdf 相同） */
async function pvHtmlPages(html, max, tag, hint) {
  if (!$('#pvDocCss')) document.head.appendChild(h('style', { id: 'pvDocCss' }, PDF_CSS));
  const pageH = Math.round(PV_PAPER_W * 1.48);
  const inner = h('div', { class: 'pdfdoc', html });
  const meas = h('div', { style: `position:absolute;left:-40000px;top:0;width:${PV_PAPER_W}px;background:#fff` }, inner);
  document.body.appendChild(meas);
  let pages;
  try {
    await Promise.race([
      Promise.all(Array.from(inner.querySelectorAll('img')).map(img => img.complete ? null : new Promise(res => { img.onload = img.onerror = res; }))),
      new Promise(res => setTimeout(res, 4000))
    ]);
    pages = computePageBreaks(inner, pageH);
  } finally { meas.remove(); }
  const shown = pages.slice(0, max);
  return shown.map(([s, e], i) => {
    const clone = inner.cloneNode(true);
    clone.style.marginTop = (-s) + 'px';
    const paper = h('div', { class: 'pv-paper', style: `width:${PV_PAPER_W + 2 * PV_PAPER_PAD}px;padding:${PV_PAPER_PAD}px` }, h('div', { class: 'pv-win', style: `width:${PV_PAPER_W}px;height:${Math.max(1, Math.ceil(e - s))}px` }, clone));
    const label = `${pvPageLabel(i + 1)}${pages.length > max ? '' : ' / ' + pages.length}`;
    return { node: pvFigure(label, i === 0 ? tag : '', i === 0 && hint ? h('div', null, [h('div', { class: 'muted small', style: 'margin-bottom:6px' }, hint), paper]) : paper) };
  });
}

/** 纯文本按行数/字数切分为页 */
function pvTextPages(text, max, tag) {
  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const pages = [];
  let cur = [], chars = 0;
  for (const ln of lines) {
    if (cur.length && (cur.length >= PV_TEXT_LINES || chars + ln.length > PV_TEXT_CHARS)) { pages.push(cur.join('\n')); cur = []; chars = 0; if (pages.length >= max) break; }
    // 超长的单行按字数切开
    let s = ln;
    while (s.length > PV_TEXT_CHARS) { pages.push(s.slice(0, PV_TEXT_CHARS)); s = s.slice(PV_TEXT_CHARS); if (pages.length >= max) break; }
    if (pages.length >= max) break;
    cur.push(s); chars += s.length;
  }
  if (cur.length && pages.length < max) pages.push(cur.join('\n'));
  if (!pages.length || !pages.some(p => p.trim())) return [{ node: pvFigure(pvPageLabel(1), tag, h('div', { class: 'pv-info' }, L(['结果为空（没有提取到文字）', 'The result is empty (no text extracted)']))) }];
  return pages.slice(0, max).map((p, i) => ({ node: pvFigure(pvPageLabel(i + 1), i === 0 ? tag : '', h('pre', { class: 'pv-text' }, p)) }));
}

/** 纸张固定宽度，窄屏按比例缩小 */
function fitPreviewPapers() {
  const body = Preview.el && Preview.el.querySelector('.pv-body');
  if (!body || !body.isConnected) return;
  const avail = body.clientWidth - 24;
  body.querySelectorAll('.pv-paper').forEach(p => { p.style.zoom = String(Math.min(1, avail / (PV_PAPER_W + 2 * PV_PAPER_PAD))); });
}
window.addEventListener('resize', () => { if (Preview.el) fitPreviewPapers(); });

/* =====================================================================
 * 3. 处理引擎
 * ===================================================================== */

/* ---------------------------------------------------------------------
 * 3.1 图片：解码 / 缩放 / 编码（含 GIF、BMP、ICO、TIFF、PSD）
 * ------------------------------------------------------------------- */
const IMG_INPUTS = ['jpg', 'jpeg', 'jfif', 'png', 'webp', 'gif', 'bmp', 'avif', 'heic', 'heif', 'tif', 'tiff', 'svg', 'ico', 'psd'];
const MAX_CANVAS_PX = 268000000;   // Chrome 画布面积上限约 2.68 亿像素

function makeCanvas(w, h) {
  w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
  if (w * h > MAX_CANVAS_PX || w > 32767 || h > 32767) throw userErr('IMG_TOO_LARGE', [`图片尺寸过大（${w}×${h}），超出浏览器画布限制`, `Image too large (${w}×${h}) for the browser canvas`], { tips: [['先缩小尺寸，或使用桌面软件处理', 'Resize first or use desktop software']] });
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
const ctx2d = c => c.getContext('2d', { willReadFrequently: false });

async function blobToCanvas(blob) {
  let bmp = null;
  try { bmp = await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch (e) { bmp = null; }
  if (bmp) {
    const c = makeCanvas(bmp.width, bmp.height);
    ctx2d(c).drawImage(bmp, 0, 0);
    if (bmp.close) bmp.close();
    return c;
  }
  const url = URL.createObjectURL(blob);

const PDF_CSS = `.pdfdoc{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC","SimSun",Arial,sans-serif;font-size:14px;line-height:1.65;color:#111;background:#fff;word-wrap:break-word;overflow-wrap:anywhere;display:flow-root}

.pdfdoc h1{font-size:24px;margin:.6em 0 .4em}.pdfdoc h2{font-size:20px;margin:.6em 0 .4em}.pdfdoc h3{font-size:17px;margin:.5em 0 .3em}
.pdfdoc p{margin:.45em 0}.pdfdoc img{height:auto}
.pdfdoc table{border-collapse:collapse;margin:.6em 0;max-width:none}.pdfdoc td,.pdfdoc th{border:1px solid #999;padding:3px 6px;vertical-align:top}.pdfdoc th{background:#eee}
.pdfdoc pre{background:#f5f5f5;padding:8px;white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px}
.pdfdoc blockquote{border-left:3px solid #ccc;margin:.5em 0;padding-left:10px;color:#444}

const PAGE_SIZES = { a4: [210, 297], a3: [297, 420], a5: [148, 210], letter: [215.9, 279.4] };

async function htmlToPdf(html, ctx, { orientation = 'portrait', pageSize = 'a4', marginMm = 12, scale = 2, fitWidth = false, quality = 0.88 } = {}) {

  const style = h('style', null, PDF_CSS);

    ctx.check();
    if (fitWidth) {
      const sw = Math.ceil(inner.scrollWidth);
      if (sw > contentW) { contentW = sw; vp.style.width = sw + 'px'; }
    }
    const pageH = Math.floor(contentW * (ph - 2 * marginMm) / (pw - 2 * marginMm));
    const pages = computePageBreaks(inner, pageH);
    if (ctx.maxPages && pages.length > ctx.maxPages) pages.length = ctx.maxPages;   // 预览：只渲染前几页
    ctx.log(`PDF: ${pages.length} pages, content ${contentW}px`);
    // 控制画布尺寸
    let sc = Math.min(scale, 4000 / contentW);
    const maxChunk = Math.max(pageH, Math.floor(16e6 / (contentW * sc * sc)));   // 单次截图面积 ≤ 1600 万像素
    const pdf = new jspdf.jsPDF({ orientation, unit: 'mm', format: [pw, ph].sort((a, b) => a - b), compress: true });
    let first = true, done = 0;
    for (let i = 0; i < pages.length;) {
      ctx.check();
      // 把若干页合并为一次截图，减少 html2canvas 调用
      let j = i, cs = pages[i][0], ce = pages[i][1];
      while (j + 1 < pages.length && pages[j + 1][1] - cs <= Math.min(maxChunk, 6000)) { j++; ce = pages[j][1]; }
      vp.style.height = (ce - cs) + 'px';
      inner.style.marginTop = (-cs) + 'px';
      const canvas = await html2canvas(vp, { scale: sc, backgroundColor: '#ffffff', useCORS: true, logging: false, scrollX: 0, scrollY: 0, windowWidth: Math.max(document.documentElement.clientWidth, contentW + 100) });
      const ky = canvas.height / (ce - cs);
      for (let k = i; k <= j; k++) {
        const [s, e] = pages[k];
        const sy = Math.round((s - cs) * ky), shh = Math.max(1, Math.round((e - s) * ky));
        const pc = makeCanvas(canvas.width, shh);

        g.drawImage(canvas, 0, sy, canvas.width, Math.min(shh, canvas.height - sy), 0, 0, canvas.width, Math.min(shh, canvas.height - sy));

        const wmm = pw - 2 * marginMm, hmm = (e - s) / contentW * wmm;

      i = j + 1;

    }

    vp.remove(); style.remove();
  }
}
/** 计算分页位置：避免切断文字行、图片、表格行；支持 .pdf-pagebreak 强制分页 */
function computePageBreaks(inner, pageH) {
  const top0 = inner.getBoundingClientRect().top;
  const total = Math.ceil(inner.scrollHeight);
  const iv = [];
  const walker = document.createTreeWalker(inner, NodeFilter.SHOW_TEXT);
  const range = document.createRange();
  let n;
  while ((n = walker.nextNode())) {
    if (!n.nodeValue.trim()) continue;
    range.selectNodeContents(n);
    for (const r of range.getClientRects()) if (r.height > 0) iv.push([r.top - top0, r.bottom - top0]);
  }
  inner.querySelectorAll('img,svg,canvas,hr,tr').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.height > 0 && r.height < pageH * 0.9) iv.push([r.top - top0, r.bottom - top0]);
  });
  const forced = Array.from(inner.querySelectorAll('.pdf-pagebreak')).map(el => Math.round(el.getBoundingClientRect().top - top0)).filter(y => y > 0 && y < total).sort((a, b) => a - b);
  iv.sort((a, b) => a[0] - b[0]);
  const segs = [];
  for (const [a, b] of iv) {
    const last = segs[segs.length - 1];
    if (last && a < last[1] - 1) last[1] = Math.max(last[1], b); else segs.push([a, b]);
  }
  const pages = [];
  let start = 0, guard = 0;
  while (start < total - 2 && guard++ < 20000) {
    let limit = start + pageH;
    const fb = forced.find(y => y > start + 5 && y <= limit);
    if (fb !== undefined) { pages.push([start, fb]); start = fb; continue; }
    if (limit >= total) { pages.push([start, total]); break; }
    let cut = limit;
    const seg = segs.find(s => s[0] < limit && s[1] > limit);
    if (seg && seg[0] > start + pageH * 0.25) cut = Math.floor(seg[0]);
    pages.push([start, cut]);
    start = cut;
  }
  if (!pages.length) pages.push([0, Math.max(total, 10)]);
  return pages;
}

    cur.lines.push(ln); size += ln.length * 2;

  }
  if (cur.lines.some(x => x.trim())) chapters.push(cur);
  chapters.forEach((c, i) => { c.title = L([`第 ${i + 1} 部分`, `Part ${i + 1}`]); });

        if (ctx.opts.markers) out.push(ctx.output === 'md' ? `\n---\n*${L(['第', 'Page '])} ${pages[i]} ${L(['页', ''])}*\n` : ctx.output === 'html' ? `<hr><p class="pg">— ${pages[i]} —</p>` : `\n—— ${L(['第', 'Page'])} ${pages[i]} ${L(['页', ''])} ——\n`);
        for (const p of paras) {
          if (ctx.output === 'md') out.push((p.level ? '#'.repeat(p.level) + ' ' : '') + p.text.replace(/([*_`#\\])/g, '\\$1') + '\n');
          else if (ctx.output === 'html') out.push(p.level ? `<h${p.level}>${escHtml(p.text)}</h${p.level}>` : `<p>${escHtml(p.text)}</p>`);
          else out.push(p.text + '\n');
        }
      }
    } finally { pdf.destroy(); }
    if (chars < pages.length * 5) ctx.warn(L(['几乎没有提取到文字，可能是扫描件，建议使用 OCR', 'Very little text found; this may be a scan — try OCR']));
    const base = baseName(ctx.file.name);
    if (ctx.output === 'html') return { name: outName(ctx.file.name, 'html'), blob: new Blob([fullHtml(base, out.join('\n'))], { type: MIME.html }) };
    return { name: outName(ctx.file.name, ctx.output), blob: new Blob([out.join('\n').replace(/\n{3,}/g, '\n\n')], { type: MIME[ctx.output] }) };
  }
});

      let c = await decodeToCanvas(ctx.files[i], ctx);
      if (+o.maxSide > 0) c = applyResize(c, { resizeMode: 'maxside', maxSide: o.maxSide });
      const usePng = !o.jpeg;
      const blob = usePng ? await canvasToBlob(c, 'image/png') : await canvasToBlob(flatten(c), 'image/jpeg', o.quality);
      const bytes = new Uint8Array(await blob.arrayBuffer());
      const img = usePng ? await doc.embedPng(bytes) : await doc.embedJpg(bytes);
      const iw = c.width * 0.75, ih = c.height * 0.75;   // 96dpi 像素 → pt
      let pw, ph;
      if (o.pageSize === 'fit') { pw = iw + o.margin * 5.6693; ph = ih + o.margin * 5.6693; }
      else { [pw, ph] = o.pageSize === 'letter' ? [612, 792] : [595.28, 841.89]; if (o.pageSize === 'a4auto' && iw > ih) [pw, ph] = [ph, pw]; }
      const m = o.margin * 2.83465;
      const k = Math.min((pw - 2 * m) / iw, (ph - 2 * m) / ih, o.pageSize === 'fit' ? 1 : Infinity);
      const page = doc.addPage([pw, ph]);
      page.drawImage(img, { x: (pw - iw * k) / 2, y: (ph - ih * k) / 2, width: iw * k, height: ih * k });
      c.width = c.height = 0;

function jsonError(e, text) {
  let pos = /position (\d+)/.exec(e.message);
  let line, col;
  const lc = /line (\d+) column (\d+)/.exec(e.message);
  if (lc) { line = +lc[1]; col = +lc[2]; }
  else if (pos) { pos = +pos[1]; const before = text.slice(0, pos); line = before.split('\n').length; col = pos - before.lastIndexOf('\n'); }
  const where = line ? L([`（第 ${line} 行，第 ${col} 列）`, ` (line ${line}, column ${col})`]) : '';
  const snippet = line ? text.split('\n')[line - 1]?.slice(Math.max(0, col - 40), col + 40) : '';
  const err = userErr('JSON_PARSE', [`JSON 格式错误${where}：${e.message}${snippet ? `\n附近：${snippet}` : ''}`, `Invalid JSON${where}: ${e.message}${snippet ? `\nNear: ${snippet}` : ''}`], { causes: [['多余或缺少逗号、引号未闭合、使用了单引号或注释', 'Extra/missing comma, unclosed quote, single quotes or comments']] });
  err.name = 'SyntaxError';
  return err;
}
async function parseDataFile(file, o, ctx) {
  const ext = getExt(file.name);
  if (['xlsx', 'xls', 'ods', 'xlsb', 'xlsm'].includes(ext)) {
    const wb = await readWorkbook(file, o);
    const names = o.allSheets ? wb.SheetNames : wb.SheetNames.slice(0, 1);
    const conv = n => { fixSheetDisplay(wb.Sheets[n], 'auto'); return XLSX.utils.sheet_to_json(wb.Sheets[n], { raw: false, defval: '' }).map(r => o.smart ? Object.fromEntries(Object.entries(r).map(([k, v]) => [k, smartValue(v)])) : r); };
    if (names.length === 1) return conv(names[0]);
    const obj = {}; names.forEach(n => obj[n] = conv(n)); return obj;
  }
  const text = await readText(file, o.inEnc || 'auto');
  switch (ext) {
    case 'json': case 'geojson': case 'webmanifest':
      try { return JSON.parse(text); } catch (e) { throw jsonError(e, text); }
    case 'jsonl': case 'ndjson':
      return text.split(/\r?\n/).filter(l => l.trim()).map((l, i) => { try { return JSON.parse(l); } catch (e) { throw userErr('JSON_PARSE', [`第 ${i + 1} 行 JSON 错误：${e.message}`, `Line ${i + 1}: ${e.message}`]); } });
    case 'yaml': case 'yml': {
      await loadLib('jsyaml');
      const docs = jsyaml.loadAll(text);
      return docs.length === 1 ? docs[0] : docs;
    }
    case 'xml': return xmlToObj(text, { attrPrefix: o.attrPrefix || '@' });
    case 'csv': case 'tsv': {
      await loadLib('papaparse');
      const r = Papa.parse(text, { header: true, skipEmptyLines: 'greedy', delimiter: ext === 'tsv' ? '\t' : '' });
      if (r.errors && r.errors.length) ctx.log(`CSV: ${r.errors.length} warnings (${r.errors[0].message})`, 'warn');
      return r.data.map(row => { const x = o.smart ? Object.fromEntries(Object.entries(row).map(([k, v]) => [k, smartValue(v)])) : row; return o.unflatten ? unflattenObj(x) : x; });
    }
    default: throw userErr('UNSUPPORTED', [`不支持的数据格式：.${ext}`, `Unsupported data format: .${ext}`]);
  }
}

function prettyXml(text, indent, minify) {
  const doc = parseXml(text);
  const err = doc.getElementsByTagName('parsererror')[0];
  if (err) throw userErr('XML_PARSE', ['XML 解析失败：' + err.textContent.replace(/\s+/g, ' ').slice(0, 200), 'XML parse error: ' + err.textContent.replace(/\s+/g, ' ').slice(0, 200)]);
  const out = [];
  const decl = /^\s*<\?xml[^>]*\?>/.exec(text);
  if (decl) out.push(decl[0].trim());
  const nl = minify ? '' : '\n';
  const walk = (node, d) => {
    for (const c of node.childNodes) {
      const p = minify ? '' : indent.repeat(d);
      if (c.nodeType === 1) {
        const attrs = Array.from(c.attributes).map(a => ` ${a.name}="${escXml(a.value)}"`).join('');
        const ks = Array.from(c.childNodes).filter(n => n.nodeType === 1 || n.nodeType === 4 || n.nodeType === 7 || (n.nodeType === 8 && !minify) || (n.nodeType === 3 && n.nodeValue.trim()));
        if (!ks.length) out.push(`${p}<${c.nodeName}${attrs}/>`);
        else if (ks.every(n => n.nodeType === 3 || n.nodeType === 4)) out.push(`${p}<${c.nodeName}${attrs}>${ks.map(n => n.nodeType === 4 ? `<![CDATA[${n.nodeValue}]]>` : escXml(n.nodeValue.trim())).join('')}</${c.nodeName}>`);
        else { out.push(`${p}<${c.nodeName}${attrs}>`); walk(c, d + 1); out.push(`${p}</${c.nodeName}>`); }
      } else if (c.nodeType === 3) { const v = c.nodeValue.trim(); if (v) out.push(p + escXml(v)); }
      else if (c.nodeType === 4) out.push(`${p}<![CDATA[${c.nodeValue}]]>`);
      else if (c.nodeType === 8 && !minify) out.push(`${p}<!--${c.nodeValue}-->`);
      else if (c.nodeType === 7) out.push(`${p}<?${c.target} ${c.data}?>`);
      else if (c.nodeType === 10) out.push(`<!DOCTYPE ${c.name}${c.publicId ? ` PUBLIC "${c.publicId}"` : ''}${c.systemId ? ` "${c.systemId}"` : ''}>`);
    }
  };
  walk(doc, 0);
  return out.join(nl) + '\n';
}

function sniffExt(b) {

  if (s(0, [0x25, 0x50, 0x44, 0x46])) return 'pdf';
  if (s(0, [0x52, 0x49, 0x46, 0x46]) && s(8, [0x57, 0x45, 0x42, 0x50])) return 'webp';
  if (s(0, [0x52, 0x49, 0x46, 0x46]) && s(8, [0x57, 0x41, 0x56, 0x45])) return 'wav';
  if (s(0, [0x50, 0x4B, 0x03, 0x04])) return 'zip';
  if (s(0, [0x49, 0x44, 0x33]) || s(0, [0xFF, 0xFB])) return 'mp3';
  if (s(4, [0x66, 0x74, 0x79, 0x70])) return 'mp4';
  if (s(0, [0x42, 0x4D])) return 'bmp';
  if (s(0, [0x1F, 0x8B])) return 'gz';
  if (s(0, [0x3C, 0x3F, 0x78, 0x6D, 0x6C])) return 'xml';
  if (s(0, [0x7B]) || s(0, [0x5B])) return 'json';
  return 'bin';
}

/** 解析时间："90"、"1:30"、"00:01:30.5" → 秒 */
function parseTime(s) {
  s = String(s || '').trim();
  if (!s) return null;
  if (/^\d+(\.\d+)?$/.test(s)) return +s;
  const m = /^(?:(\d+):)?(\d{1,2}):(\d{1,2}(?:\.\d+)?)$/.exec(s);
  if (!m) throw userErr('BAD_TIME', [`时间格式错误：“${s}”，示例：90 或 01:30 或 00:01:30`, `Invalid time "${s}". Examples: 90, 01:30, 00:01:30`]);
  return (+m[1] || 0) * 3600 + (+m[2]) * 60 + (+m[3]);
}
function trimArgs(o) {

/* =====================================================================
 * 5. 初始化与全局事件
 * ===================================================================== */
function init() {
  loadSettings();
  applyTheme();
  // 全局错误兜底：页面内提示，不弹 alert
  window.addEventListener('error', e => {
    if (e && e.target && e.target !== window && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'IMG')) return;
    log(`${t('uncaught')}: ${e.message || e}`, 'error');
    toast({ type: 'error', title: t('uncaught'), body: String(e.message || e).slice(0, 300) });
    e.preventDefault();
  });
  window.addEventListener('unhandledrejection', e => {
    const r = e.reason;
    e.preventDefault();
    if (isAbort(r)) return;
    const d = diagnose(r);
    log(`${t('uncaught')}: ${r && r.stack ? r.stack.split('\n')[0] : r}`, 'error');
    toast({ type: 'error', title: t('uncaught'), body: d.reason, causes: d.causes, tips: d.tips });
  });
  // 阻止浏览器直接打开拖入页面的文件
  ['dragover', 'drop'].forEach(ev => document.addEventListener(ev, e => {
    if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {
      e.preventDefault();
      if (ev === 'drop') addFiles(Array.from(e.dataTransfer.files || []));
    }
  }));
  // 粘贴图片/文件
  document.addEventListener('paste', e => {
    const items = Array.from((e.clipboardData && e.clipboardData.items) || []).filter(i => i.kind === 'file');
    if (!items.length) return;
    e.preventDefault();
    const d = new Date();
    const files = items.map((it, i) => {
      const f = it.getAsFile();
      if (!f) return null;
      const ext = (f.type.split('/')[1] || 'bin').replace('jpeg', 'jpg').replace('svg+xml', 'svg');
      const name = f.name && f.name !== 'image.png' ? f.name : `pasted_${pad(d.getHours(), 2)}${pad(d.getMinutes(), 2)}${pad(d.getSeconds(), 2)}_${i + 1}.${ext}`;
      return new File([f], name, { type: f.type, lastModified: Date.now() + i });
    }).filter(Boolean);
    if (files.length) { addFiles(files); toast({ type: 'ok', title: t('pasteAdded'), body: files.map(f => f.name).join(', '), timeout: 2500 }); }
  });
  $('#fileInput').addEventListener('change', e => { addFiles(Array.from(e.target.files || [])); e.target.value = ''; });
  $('#navSearch').addEventListener('input', renderNav);
  $('#navToggle').addEventListener('click', () => $('#sidebar').classList.toggle('collapsed'));
  if (window.matchMedia('(max-width: 820px)').matches) $('#sidebar').classList.add('collapsed');
  $('#btnLang').addEventListener('click', () => { state.lang = state.lang === 'en' ? 'zh' : 'en'; saveSettings(); applyI18n(); });
  $('#btnHelp').addEventListener('click', showHelp);
  $('#btnSettings').addEventListener('click', showSettings);
  $('#btnZipAll').addEventListener('click', zipAll);
  $('#btnCancelAll').addEventListener('click', () => state.jobs.forEach(j => cancelJob(j)));
  $('#btnClearDone').addEventListener('click', () => { state.jobs = state.jobs.filter(j => j.status === 'running' || j.status === 'queued'); renderTasks(); });
  $('#btnClearLog').addEventListener('click', () => { state.logs = []; $('#logBox').innerHTML = ''; });
  $('#btnCopyLog').addEventListener('click', () => {
    const text = state.logs.map(l => `[${l.time}] ${l.msg}`).join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject(new Error('clipboard unavailable')))
      .then(() => toast({ type: 'ok', title: t('copied'), timeout: 1500 }))
      .catch(() => { downloadBlob(new Blob([text], { type: MIME.txt }), 'converter-log.txt'); });
  });
  $$('.tabs button').forEach(b => b.addEventListener('click', () => {
    $$('.tabs button').forEach(x => x.classList.toggle('active', x === b));
    $('#tabTasks').classList.toggle('hidden', b.dataset.tab !== 'tasks');
    $('#tabLogs').classList.toggle('hidden', b.dataset.tab !== 'logs');
  }));
  window.addEventListener('beforeunload', e => {
    if (state.jobs.some(j => j.status === 'running' || j.status === 'queued')) { e.preventDefault(); e.returnValue = ''; }
  });
  const hash = decodeURIComponent((location.hash || '').slice(1));
  state.view = Registry.get(hash) ? hash : 'home';
  applyI18n();
  const runnable = Registry.list.filter(c => c.runnable).length;
  log(`Local File Converter ready · ${Registry.list.length} converters (${runnable} runnable) · ${location.protocol}`, 'ok');
}
